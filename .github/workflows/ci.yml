name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to PythonAnywhere
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    concurrency:
      group: pythonanywhere-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USERNAME: ${{ vars.PA_USERNAME || 'vls2693' }}
          PA_DOMAIN: ${{ vars.PA_DOMAIN || 'vls2693.pythonanywhere.com' }}
          PA_PROJECT_DIR: ${{ vars.PA_PROJECT_DIR || '/home/vls2693/common_calculator' }}
          PA_VENV: ${{ vars.PA_VENV || '/home/vls2693/.virtualenvs/myenv' }}
        run: python3 .github/scripts/deploy_pythonanywhere.py
